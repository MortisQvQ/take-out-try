spring.application.name=take-out-try



server.error.include-stacktrace=never

spring.datasource.url=jdbc:mysql://localhost:3306/takeout_try?useSSL=false&serverTimezone=UTC&characterEncoding=utf8&useUnicode=true
spring.datasource.username=root
spring.datasource.password=123456

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
